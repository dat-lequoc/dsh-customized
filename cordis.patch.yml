# Cordis patch layer for dsh-customized:
# Inserts the dsh-customized plugin into the Harness runtime.
#
# Usage:
#   1. On-demand via CLI argument:
#      pnpm dsh web --patch path/to/dsh-customized/cordis.patch.yml
#
#   2. Persistent for all profiles in $DSH_HOME/cordis.patch.yml (typically ~/.dsh/cordis.patch.yml):
#      - insert:
#          - id: dsh-customized
#            name: path/to/dsh-customized/lib/index.js
#
- insert:
    - id: dsh-customized
      name: ./lib/index.js
